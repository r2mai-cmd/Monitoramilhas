
name: Monitor de promoções

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,9,15,21 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar monitor
        run: python monitor/monitor.py

      - name: Salvar relatório de consultas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor_fontes.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza relatório do monitor"
            git push
          else
            echo "Nenhuma alteração no relatório."
          fi
